<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Одиссея: Возвращение на Итаку</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Philosopher:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #12100e;
      --card-bg: #1e1915;
      --terracotta: #c85a17;
      --terracotta-bright: #e06a28;
      --clay-light: #e8d0b5;
      --clay-dim: #a6927d;
      --border-color: #8c3b0d;
      --wrath-red: #d93838;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--clay-light);
      font-family: 'Philosopher', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .quest-container {
      max-width: 850px;
      width: 100%;
      background-color: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Греческий меандровый орнамент */
    .meander-border {
      height: 18px;
      background-color: var(--terracotta);
      background-image: repeating-linear-gradient(
        90deg,
        var(--bg-dark) 0px, var(--bg-dark) 4px,
        var(--terracotta) 4px, var(--terracotta) 10px,
        var(--bg-dark) 10px, var(--bg-dark) 14px
      );
      width: 100%;
    }

    .hud-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      background: #171310;
      padding: 12px 20px;
      border-bottom: 2px solid var(--border-color);
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .hud-label {
      font-size: 0.75rem;
      color: var(--clay-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hud-value {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--terracotta-bright);
    }

    .hud-value.wrath { color: var(--wrath-red); }

    .content-area {
      padding: 30px 25px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .chapter-title {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      color: var(--terracotta-bright);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .story-text {
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--clay-light);
      white-space: pre-line;
    }

    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .choice-btn {
      background: linear-gradient(180deg, #2a221b 0%, #1a1410 100%);
      border: 1px solid var(--border-color);
      color: var(--clay-light);
      padding: 14px 18px;
      font-family: 'Philosopher', serif;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .choice-btn:hover {
      background: var(--terracotta);
      color: #000;
      border-color: var(--terracotta-bright);
      font-weight: bold;
    }

    .choice-effect {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-left: 10px;
      font-style: italic;
    }

    .restart-btn {
      background-color: var(--terracotta);
      color: #000;
      border: none;
      padding: 14px;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      text-transform: uppercase;
      margin-top: 20px;
    }

    .restart-btn:hover {
      background-color: var(--terracotta-bright);
    }
  </style>
</head>
<body>

  <div class="quest-container">
    <div class="meander-border"></div>

    <div class="hud-bar">
      <div class="hud-item">
        <span class="hud-label">Время в пути</span>
        <span class="hud-value" id="stat-years">0 лет</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Спутники</span>
        <span class="hud-value" id="stat-crew">600 воинов</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Гнев Богов</span>
        <span class="hud-value wrath" id="stat-wrath">10%</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Мораль</span>
        <span class="hud-value" id="stat-morale">100%</span>
      </div>
    </div>

    <div class="content-area">
      <h2 class="chapter-title" id="chapter-title">Загрузка...</h2>
      <div class="story-text" id="story-text"></div>
      <div class="choices-container" id="choices-container"></div>
    </div>

    <div class="meander-border"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
