<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Одиссея: Возвращение на Итаку</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Philosopher:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #12100e;
      --card-bg: #1e1915;
      --terracotta: #c85a17;
      --terracotta-bright: #e06a28;
      --clay-light: #e8d0b5;
      --clay-dim: #a6927d;
      --border-color: #8c3b0d;
      --wrath-red: #d93838;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--clay-light);
      font-family: 'Philosopher', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .quest-container {
      max-width: 850px;
      width: 100%;
      background-color: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* Греческий меандровый орнамент */
    .meander-border {
      height: 18px;
      background-color: var(--terracotta);
      background-image: repeating-linear-gradient(
        90deg,
        var(--bg-dark) 0px, var(--bg-dark) 4px,
        var(--terracotta) 4px, var(--terracotta) 10px,
        var(--bg-dark) 10px, var(--bg-dark) 14px
      );
      width: 100%;
    }
    .hud-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      background: #171310;
      padding: 12px 20px;
      border-bottom: 2px solid var(--border-color);
    }
    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .hud-label {
      font-size: 0.75rem;
      color: var(--clay-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .hud-value {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--terracotta-bright);
    }
    .hud-value.wrath { color: var(--wrath-red); }
    .content-area {
      padding: 30px 25px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .chapter-title {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      color: var(--terracotta-bright);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .story-text {
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--clay-light);
      white-space: pre-line;
    }
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }
    .choice-btn {
      background: linear-gradient(180deg, #2a221b 0%, #1a1410 100%);
      border: 1px solid var(--border-color);
      color: var(--clay-light);
      padding: 14px 18px;
      font-family: 'Philosopher', serif;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .choice-btn:hover {
      background: var(--terracotta);
      color: #000;
      border-color: var(--terracotta-bright);
      font-weight: bold;
    }
    .choice-effect {
      font-size: 0.85rem;
      opacity: 0.85;
      margin-left: 10px;
      font-style: italic;
    }
    .restart-btn {
      background-color: var(--terracotta);
      color: #000;
      border: none;
      padding: 14px;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      text-transform: uppercase;
      margin-top: 20px;
    }
    .restart-btn:hover {
      background-color: var(--terracotta-bright);
    }
  </style>
</head>
<body>
  <div class="quest-container">
    <div class="meander-border"></div>
    <div class="hud-bar">
      <div class="hud-item">
        <span class="hud-label">Время в пути</span>
        <span class="hud-value" id="stat-years">0 лет</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Спутники</span>
        <span class="hud-value" id="stat-crew">600 воинов</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Гнев Богов</span>
        <span class="hud-value wrath" id="stat-wrath">10%</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Мораль</span>
        <span class="hud-value" id="stat-morale">100%</span>
      </div>
    </div>
    <div class="content-area">
      <h2 class="chapter-title" id="chapter-title">Загрузка...</h2>
      <div class="story-text" id="story-text"></div>
      <div class="choices-container" id="choices-container"></div>
    </div>
    <div class="meander-border"></div>
  </div>
  <script>
    // Состояние игры
    var state = {
      years: 0,
      crew: 600,
      wrath: 10,
      morale: 100,
      currentScene: 'start'
    };
    function modifyState(years, crewChange, wrathChange, moraleChange) {
      state.years += years;
      state.crew = Math.max(2, state.crew + crewChange);
      state.wrath = Math.min(100, Math.max(0, state.wrath + wrathChange));
      state.morale = Math.min(100, Math.max(0, state.morale + moraleChange));
      updateHUD();
    }
    function updateHUD() {
      document.getElementById('stat-years').innerText = state.years.toFixed(1) + ' лет';
      document.getElementById('stat-crew').innerText = state.crew + ' воинов';
      document.getElementById('stat-wrath').innerText = state.wrath + '%';
      document.getElementById('stat-morale').innerText = state.morale + '%';
    }
    function goTo(sceneKey) {
      state.currentScene = sceneKey;
      var scene = story[sceneKey];
      document.getElementById('chapter-title').innerText = scene.title;
      if (sceneKey === 'ending') {
        renderEnding();
        return;
      }
      document.getElementById('story-text').innerText = scene.text;
      var choicesContainer = document.getElementById('choices-container');
      choicesContainer.innerHTML = '';
      scene.choices.forEach(function(choice) {
        var btn = document.createElement('button');
        btn.className = 'choice-btn';
        var textSpan = document.createElement('span');
        textSpan.innerText = choice.text;
        var effectSpan = document.createElement('span');
        effectSpan.className = 'choice-effect';
        effectSpan.innerText = choice.effect;
        btn.appendChild(textSpan);
        btn.appendChild(effectSpan);
        btn.onclick = function() {
          choice.action();
        };
        choicesContainer.appendChild(btn);
      });
    }
    function renderEnding() {
      var totalTime = 10 + state.years;
      var endingText = "Скитания Одиссея завершены.\n\n";
      endingText += "• Общее время отсутствия: " + totalTime.toFixed(1) + " лет (10 лет войны + " + state.years.toFixed(1) + " лет скитаний).\n";
      endingText += "• Выжившие спутники: " + (state.crew > 1 ? state.crew + " человек" : "Только сам Одиссей (все остальные погибли)") + ".\n";
      endingText += "• Финальное отношение богов: " + (state.wrath < 30 ? "Олимп сменил гнев на милость" : "Посейдон навсегда затаил обиду") + ".\n\n";
      endingText += "Вы очистили свой дом от заговорщиков, доказали Пенелопе свою личность через тайну оливкового ложа и восстановили мир на Итаке при поддержке Афины Паллады.";
      document.getElementById('story-text').innerText = endingText;
      var choicesContainer = document.getElementById('choices-container');
      choicesContainer.innerHTML = '';
      var restartBtn = document.createElement('button');
      restartBtn.className = 'restart-btn';
      restartBtn.innerText = 'Начать поход заново';
      restartBtn.onclick = resetGame;
      choicesContainer.appendChild(restartBtn);
    }
    function resetGame() {
      state = { years: 0, crew: 600, wrath: 10, morale: 100, currentScene: 'start' };
      updateHUD();
      goTo('start');
    }
    // Сценарий квеста
    var story = {
      start: {
        title: "1. Отплытие из-под павшей Трои",
        text: "Десять лет осады позади. Троя сожжена благодаря вашей хитрой деревянной лошадке. Двенадцать кораблей Итаки с шестью сотнями воинов выходят в Эгейское море. Гребцы поют песню о скором возвращении к жёнам, но олимпийские боги уже плетут свои сети...",
        choices: [
          {
            text: "Принести пышные жертвы Зевсу перед отплытием",
            effect: "+1 год, Гнев -10%",
            action: function() { modifyState(1, 0, -10, 10); goTo('lotus'); }
          },
          {
            text: "Спешить домой без промедления!",
            effect: "Гнев +15%",
            action: function() { modifyState(0, 0, 15, -10); goTo('lotus'); }
          }
        ]
      },
      lotus: {
        title: "2. Остров Лотофагов",
        text: "Шторм пригнал корабли к берегу, где местные жители питаются сладкими цветами лотоса. Отправив разведку, вы обнаруживаете, что ваши воины забыли Итаку, семьи и долг — они сидят в блаженной нирване и жуют бутоны.",
        choices: [
          {
            text: "Силой притащить дураков на корабли и связать под банками",
            effect: "+0.5 года, Мораль -10%",
            action: function() { modifyState(0.5, 0, 0, -10); goTo('cyclops'); }
          },
          {
            text: "Оставить отведавших лотоса и отплыть с верными",
            effect: "-12 воинов",
            action: function() { modifyState(0, -12, 0, 5); goTo('cyclops'); }
          }
        ]
      },
      cyclops: {
        title: "3. Пещера Киклопа Полифема",
        text: "Вы заперты в пещере одноглазого гиганта Полифема, сына Посейдона. Он уже позавтракал двумя вашими воинами. У вас есть огромный сосновый кол и мех с крепким фракийским вином.",
        choices: [
          {
            text: "Напоить Полифема, назваться «Никем» и ослепить во сне",
            effect: "-6 воинов, Гнев Посейдона +40%",
            action: function() { modifyState(1, -6, 40, -10); goTo('aeolus'); }
          },
          {
            text: "Выкрасть ключи и попытаться сбежать тихо ночью",
            effect: "-30 воинов, Гнев +10%",
            action: function() { modifyState(0.5, -30, 10, -20); goTo('aeolus'); }
          }
        ]
      },
      aeolus: {
        title: "4. Остров Эола — Повелителя Ветров",
        text: "Эол дарит вам кожаный мех, в который завязаны все буйные ветры, кроме попутного Зефира. Родная Итака уже виднеется на горизонте! Но когда вы засыпаете от усталости, спутники начинают шептаться, что в мешке скрыто троянское золото...",
        choices: [
          {
            text: "Спать. Вы не спали трое суток...",
            effect: "Буря отбрасывает назад! +2 года",
            action: function() { modifyState(2, -20, 15, -20); goTo('laestrygonians'); }
          },
          {
            text: "Держать мех в руках и не смыкать глаз",
            effect: "Успешный причал на время, Гнев +5%",
            action: function() { modifyState(0.5, 0, 5, 10); goTo('laestrygonians'); }
          }
        ]
      },
      laestrygonians: {
        title: "5. Лестригоны-людоеды",
        text: "Ваш флот заходит в уютную гавань, окружённую скалами. Местные жители оказываются исполинскими людоедами. Они начинают швырять в корабли огромные валуны и нанизывать воинов на пики, как рыбу!",
        choices: [
          {
            text: "Приказать своему кораблю перерубить канаты и бежать из гавани",
            effect: "Потеря большинства кораблей и воинов",
            action: function() {
              var currentCrew = state.crew;
              modifyState(0.5, -Math.floor(currentCrew * 0.8), 10, -30);
              goTo('circe');
            }
          },
          {
            text: "Попытаться принять бой на берегу и спасти флот",
            effect: "Тяжёлые потери, +2 года",
            action: function() {
              var currentCrew = state.crew;
              modifyState(2, -Math.floor(currentCrew * 0.9), 20, -40);
              goTo('circe');
            }
          }
        ]
      },
      circe: {
        title: "6. Остров Ээя и чары Цирцеи",
        text: "Красивая волшебница Цирцея превратила вашу разведку в упитанных свиней. Бог Гермес даёт вам волшебный корень «моли», защищающий от магии, и пару пикантных советов.",
        choices: [
          {
            text: "Принять приглашение Цирцеи, обнажить меч и остаться на год",
            effect: "+1 год, Мораль +30%",
            action: function() { modifyState(1, 0, -10, 30); goTo('underworld'); }
          },
          {
            text: "Заставить её вернуть людям облик и немедленно отплыть",
            effect: "+0.5 года, Гнев +10%",
            action: function() { modifyState(0.5, 0, 10, -10); goTo('underworld'); }
          }
        ]
      },
      underworld: {
        title: "7. Царство Аида (Некромантия)",
        text: "Вы спустились на край земли, чтобы принести жертву и спросить тень слепого пророка Тиресия о дороге домой. В тумане к вам подходят тени вашей матери и павших под Троей друзей — Ахилла и Агамемнона.",
        choices: [
          {
            text: "Выслушать строгие пророчества Тиресия и предостережения Ахилла",
            effect: "+1 год, Гнев -10%",
            action: function() { modifyState(1, 0, -10, 0); goTo('sirens'); }
          },
          {
            text: "Быстро расспросить мать и скорее бежать от мрака Аида",
            effect: "Мораль -15%",
            action: function() { modifyState(0.5, 0, 5, -15); goTo('sirens'); }
          }
        ]
      },
      sirens: {
        title: "8. Сирены, Сцилла и Харибда",
        text: "Впереди сладкоголосые Сирены и узкий пролив между монстром Сциллой с шестью головами и водоворотом Харибдой. Приказать залить уши воском — разумно, но кого принести в жертву?",
        choices: [
          {
            text: "Прижаться к Сцилле (потерять 6 воинов, но спасти корабль)",
            effect: "-6 воинов",
            action: function() { modifyState(0.5, -6, 0, -10); goTo('helios'); }
          },
          {
            text: "Пройти по центру между Харибдой и Сциллой",
            effect: "-15 воинов, Гнев +20%",
            action: function() { modifyState(1, -15, 20, -20); goTo('helios'); }
          }
        ]
      },
      helios: {
        title: "9. Священные быки Гелиоса",
        text: "Буря заперла вас на острове Фринакия. Еда кончилась. Пока вы молились в глубине острова, голодные спутники закололи священных золотых быков бога Солнца Гелиоса. Разгневанный бог грозит уйти в Аид!",
        choices: [
          {
            text: "Выйти в море. Принять карающую молнию Зевса",
            effect: "Гибель всех спутников. Одиссей выживает один",
            action: function() {
              modifyState(2, 0, 30, -50);
              state.crew = 1;
              updateHUD();
              goTo('calypso');
            }
          }
        ]
      },
      calypso: {
        title: "10. Плен у нимфы Калипсо",
        text: "Вы выброшены штормом на остров Огигия. Нимфа Калипсо влюблена в вас, предлагает бессмертие и вечную молодость. Проходит 7 лет, пока Афина не умоляет Зевса вмешаться.",
        choices: [
          {
            text: "Отвергнуть бессмертие, построить плот и плыть к Пенелопе",
            effect: "+7 лет, Гнев -20%",
            action: function() { modifyState(7, 0, -20, 20); goTo('phaeacians'); }
          }
        ]
      },
      phaeacians: {
        title: "11. Страна Феаков (Схерия)",
        text: "Посейдон разбивает ваш плот, но юная царевна Навсикая находит вас на берегу. Царь Алкиной устраивает пир, где вы рассказываете свои легендарные приключения.",
        choices: [
          {
            text: "Принять быстрый волшебный корабль феаков до Итаки",
            effect: "+0.5 года, Полный отдых",
            action: function() { modifyState(0.5, 0, -10, 50); goTo('ithaca_battle'); }
          }
        ]
      },
      ithaca_battle: {
        title: "12. Битва в зале Итаки (Финал)",
        text: "Вы вернулись нищим стариком. В вашем доме 108 дерзких женихов пируют и разоряют царство. Пенелопа объявляет испытание: тот, кто натянет тугой лук Одиссея и прострелит 12 колец, станет её мужем. Вы берёте лук в руки...",
        choices: [
          {
            text: "Запереть двери зала и перебить всех женихов до единого!",
            effect: "Кровавая победа, возвращение трона",
            action: function() { goTo('ending'); }
          },
          {
            text: "Предложить помилование тем, кто сложит оружие и возместит ущерб",
            effect: "Менее кровавый финал",
            action: function() { goTo('ending'); }
          }
        ]
      },
      ending: {
        title: "Эпилог: Возвращение Царя",
        text: "",
        choices: []
      }
    };
    // Запуск игры после полной загрузки страницы
    window.addEventListener('DOMContentLoaded', function() {
      updateHUD();
      goTo('start');
    });
  </script>
</body>
</html>
