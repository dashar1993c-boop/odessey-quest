 <!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Одиссея: Возвращение на Итаку</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Philosopher:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #12100e;
      --card-bg: #1e1915;
      --terracotta: #c85a17;
      --terracotta-bright: #e06a28;
      --clay-light: #e8d0b5;
      --clay-dim: #a6927d;
      --border-color: #8c3b0d;
      --wrath-red: #d93838;
      --ending-gold: #ffd700;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--clay-light);
      font-family: 'Philosopher', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .quest-container {
      max-width: 850px;
      width: 100%;
      background-color: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .meander-border {
      height: 18px;
      background-color: var(--terracotta);
      background-image: repeating-linear-gradient(
        90deg,
        var(--bg-dark) 0px, var(--bg-dark) 4px,
        var(--terracotta) 4px, var(--terracotta) 10px,
        var(--bg-dark) 10px, var(--bg-dark) 14px
      );
      width: 100%;
    }

    .hud-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      background: #171310;
      padding: 12px 20px;
      border-bottom: 2px solid var(--border-color);
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .hud-label {
      font-size: 0.75rem;
      color: var(--clay-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hud-value {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--terracotta-bright);
    }

    .hud-value.wrath { color: var(--wrath-red); }

    .content-area {
      padding: 30px 25px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .chapter-title {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      color: var(--terracotta-bright);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .story-text {
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--clay-light);
      white-space: pre-line;
    }

    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .choice-btn {
      background: linear-gradient(180deg, #2a221b 0%, #1a1410 100%);
      border: 1px solid var(--border-color);
      color: var(--clay-light);
      padding: 14px 18px;
      font-family: 'Philosopher', serif;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .choice-btn:hover {
      background: var(--terracotta);
      color: #000;
      border-color: var(--terracotta-bright);
      font-weight: bold;
    }

    .choice-effect {
      font-size: 0.85rem;
      opacity: 0.85;
      margin-left: 10px;
      font-style: italic;
    }

    .restart-btn {
      background-color: var(--terracotta);
      color: #000;
      border: none;
      padding: 14px;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      text-transform: uppercase;
      margin-top: 20px;
    }

    .restart-btn:hover {
      background-color: var(--terracotta-bright);
    }
  </style>
</head>
<body>

  <div class="quest-container">
    <div class="meander-border"></div>

    <div class="hud-bar">
      <div class="hud-item">
        <span class="hud-label">Скитания</span>
        <span class="hud-value" id="stat-years">0 лет</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Спутники</span>
        <span class="hud-value" id="stat-crew">600 воинов</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Гнев Богов</span>
        <span class="hud-value wrath" id="stat-wrath">10%</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Мораль</span>
        <span class="hud-value" id="stat-morale">100%</span>
      </div>
    </div>

    <div class="content-area">
      <h2 class="chapter-title" id="chapter-title">Загрузка...</h2>
      <div class="story-text" id="story-text"></div>
      <div class="choices-container" id="choices-container"></div>
    </div>

    <div class="meander-border"></div>
  </div>

  <script>
    var state = {
      years: 0,
      crew: 600,
      wrath: 10,
      morale: 100,
      hasMap: false,
      currentScene: 'start'
    };

    function modifyState(years, crewChange, wrathChange, moraleChange) {
      state.years = Math.max(0, state.years + years);
      state.crew = Math.max(1, state.crew + crewChange);
      state.wrath = Math.min(100, Math.max(0, state.wrath + wrathChange));
      state.morale = Math.min(100, Math.max(0, state.morale + moraleChange));
      updateHUD();
    }

    function updateHUD() {
      document.getElementById('stat-years').innerText = state.years.toFixed(1) + ' лет';
      document.getElementById('stat-crew').innerText = state.crew + ' воинов';
      document.getElementById('stat-wrath').innerText = state.wrath + '%';
      document.getElementById('stat-morale').innerText = state.morale + '%';
    }

    function goTo(sceneKey) {
      state.currentScene = sceneKey;
      var scene = story[sceneKey];
      
      document.getElementById('chapter-title').innerText = scene.title;
      
      if (scene.isEnding) {
        renderCustomEnding(scene);
        return;
      }

      document.getElementById('story-text').innerText = scene.text;
      var choicesContainer = document.getElementById('choices-container');
      choicesContainer.innerHTML = '';

      scene.choices.forEach(function(choice) {
        var btn = document.createElement('button');
        btn.className = 'choice-btn';
        
        var textSpan = document.createElement('span');
        textSpan.innerText = choice.text;
        
        var effectSpan = document.createElement('span');
        effectSpan.className = 'choice-effect';
        effectSpan.innerText = choice.effect;

        btn.appendChild(textSpan);
        btn.appendChild(effectSpan);
        
        btn.onclick = function() {
          choice.action();
        };
        
        choicesContainer.appendChild(btn);
      });
    }

    function renderCustomEnding(scene) {
      var totalTime = 10 + state.years;
      var endingText = scene.text + "\n\n";
      endingText += "═══════════════════════════════════\n";
      endingText += "ИТОГИ ВАШЕГО ПОХОДА:\n";
      endingText += "• Время отсутствия: " + totalTime.toFixed(1) + " лет (10 лет войны + " + state.years.toFixed(1) + " лет скитаний).\n";
      endingText += "• Выжило спутников: " + state.crew + " из 600 воинов.\n";
      endingText += "• Наличие финикийской карты: " + (state.hasMap ? "Да" : "Нет") + ".\n";
      endingText += "• Уровень гнева Олимпа: " + state.wrath + "%.\n";

      document.getElementById('story-text').innerText = endingText;
      var choicesContainer = document.getElementById('choices-container');
      choicesContainer.innerHTML = '';
     var restartBtn = document.createElement('button');
      restartBtn.className = 'restart-btn';
      restartBtn.innerText = 'Начать поход заново';
      restartBtn.onclick = resetGame;
      choicesContainer.appendChild(restartBtn);
    }

    function resetGame() {
      state = { years: 0, crew: 600, wrath: 10, morale: 100, hasMap: false, currentScene: 'start' };
      updateHUD();
      goTo('start');
    }

    var story = {
      start: {
        title: "1. Отплытие из-под павшей Трои",
        text: "Троя пала. Двенадцать кораблей Итаки готовятся к отплытию. В гавани стоит богатый финикийский купеческий галер, на борту которого скрываются редкие навигационные карты течений Эгейского моря.",
        choices: [
          {
            text: "Захватить финикийскую галеру и забрать секретную карту мореходов!",
            effect: "[КАРТА ПОЛУЧЕНА] Шанс быстрого пути!",
            action: function() { 
              state.hasMap = true;
              modifyState(0.1, -5, 5, 10); 
              goTo('map_navigation'); 
            }
          },
          {
            text: "Плыть по стандарту, принеся пышную жертву Афине",
            effect: "Стандартный путь, Гнев -10%",
            action: function() { modifyState(0.2, 0, -10, 10); goTo('great_storm'); }
          },
          {
            text: "Разграбить город киконов для наживы",
            effect: "+1 год, -40 воинов, Гнев +15%",
            action: function() { modifyState(1, -40, 15, -10); goTo('lotus'); }
          }
        ]
      },

      map_navigation: {
        title: "ЭКСПРЕСС-ПУТЬ: Навигация по финикийской карте",
        text: "Секретные папирусы финикийцев указывают скрытые подводные течения и безопасные фарватеры в обход владений чудовищ и киклопов!",
        choices: [
          {
            text: "Следовать тайному южному течению прямо к Итаке",
            effect: "Сократить скитания до 1 года!",
            action: function() { modifyState(0.8, 0, -10, 20); goTo('aeolus'); }
          },
          {
            text: "Использовать карту для захода на Остров Эола за ветром",
            effect: "Мгновенный перелет к Итаке",
            action: function() { modifyState(0.3, 0, -10, 30); goTo('aeolus'); }
          }
        ]
      },

      great_storm: {
        title: "2. Великий Шторм у Мыса Малея",
        text: "Черные тучи закрыли солнце. Ревущий северный ветер сносит корабли к мелям и скалам. Волны захлестывают палубу!",
        choices: [
          {
            text: "Приказать грести под углом 45 градусов к волне и держать курс по компасу Зевса",
            effect: "ПРАВИЛЬНЫЙ МАНЕВР! Без потерь пройти шторм",
            action: function() { modifyState(0.2, 0, -10, 15); goTo('cyclops'); }
          },
          {
            text: "Спустить паруса и отдаться воле стихии",
            effect: "Унесет к Острову Лотофагов (+1 год)",
            action: function() { modifyState(1, -15, 10, -10); goTo('lotus'); }
          },
          {
            text: "Бросить тяжелые якорные камни прямо на глубине",
            effect: "Тросы рвутся, потери людей (-50 воинов)",
            action: function() { modifyState(0.5, -50, 15, -20); goTo('cyclops'); }
          }
        ]
      },

      lotus: {
        title: "3. Остров Лотофагов",
        text: "Ваши воины попробовали сладкий лотос и забыли об Итаке. Они сидят на траве и блаженно улыбаются.",
        choices: [
          {
            text: "Связать их и забросить на корабли силачи-офицеры",
            effect: "+0.3 года, Скоростное отплытие",
            action: function() { modifyState(0.3, 0, 0, -5); goTo('cyclops'); }
          },
          {
            text: "Бросить дураков и плыть дальше",
            effect: "-20 воинов",
            action: function() { modifyState(0, -20, 0, 0); goTo('cyclops'); }
          }
        ]
      },

      cyclops: {
        title: "4. Пещера Киклопа Полифема",
        text: "Вы вошли в пещеру одноглазого гиганта Полифема. В углу стоят головки сыра и кувшины с молоком.",
        choices: [
          {
            text: "Не трогать сыр! Уважить хозяина и вежливо попросить о гостеприимстве",
            effect: "Альтернативный путь! Без проклятия Посейдона!",
            action: function() { modifyState(0.2, 0, -20, 10); goTo('aeolus'); }
          },
          {
            text: "Жрать сыр без спроса, напоить гиганта вином и проткнуть ему глаз",
            effect: "Проклятие Посейдона! Гнев +50%",
            action: function() { modifyState(1, -10, 50, -10); goTo('aeolus'); }
          }
        ]
      },

      aeolus: {
        title: "5. Остров Эола — Повелителя Ветров",
        text: "Эол вручает вам мех со скованными буйными ветрами. До Итаки остаётся всего день пути! Вдалеке уже видны костры пастухов родного острова. Вы смертельно устали.",
        choices: [
          {
            text: "Не смыкать глаз и лично вести корабль в гавань",
            effect: "Шанс сразу попасть домой!",
            action: function() { 
              if (state.hasMap || state.wrath < 30) {
                if (state.hasMap) {
                  goTo('ending_legendary');
                } else {
                  goTo('ithaca_battle');
                }
              } else {
                modifyState(0.2, 0, 0, 10); goTo('laestrygonians');
              }
            }
          },
          {
            text: "Уснуть. Спутники сами доплывут...",
            effect: "Команда открывает мех!",
            action: function() { 
              if (state.wrath > 40) {
                goTo('ending_storm_death');
              } else {
                modifyState(2, -30, 20, -20); goTo('laestrygonians');
              }
            }
          }
        ]
      },

      laestrygonians: {
        title: "6. Лестригоны-людоеды",
        text: "Гиганты-людоеды швыряют утесы в ваши корабли. У вас есть секунда на решение.",
        choices: [
          {
            text: "Перерубить канат только своего флагмана и уходить в море",
            effect: "-450 воинов, быстрый побег",
            action: function() { modifyState(0.2, -450, 0, -30); goTo('circe'); }
          },
          {
            text: "Пытаться вытащить весь флот из узкого затона",
            effect: "+2 года, -500 воинов",
            action: function() { modifyState(2, -500, 10, -40); goTo('circe'); }
          }
        ]
      },

      circe: {
        title: "7. Остров Ээя и чары Цирцеи",
        text: "Волшебница Цирцея превратила половину вашей команды в свиней и приглашает вас на пир. Гермес дал вам защитный корень, но волшебный напиток выглядит невероятно искусительно...",
        choices: [
          {
            text: "Выбросить корень Гермеса и выпить зелье Цирцеи с голоду",
            effect: "Секретный финал!",
            action: function() { goTo('ending_pig'); }
          },
          {
            text: "Съесть корень, пригрозить Цирцее мечом и спасти друзей",
            effect: "+0.5 года, Путь продолжается",
            action: function() { modifyState(0.5, 0, -10, 20); goTo('underworld'); }
          }
        ]
      },

      underworld: {
        title: "8. Царство Аида",
        text: "Вы призвали пророка Тиресия. Он указывает прямой безопасный маршрут, но требует принести в жертву черного барана.",
        choices: [
          {
            text: "Исполнить ритуал точно по инструкции Тиресия",
            effect: "Гнев -20%, Ускорение похода",
            action: function() { modifyState(0.3, 0, -20, 10); goTo('sirens'); }
          },
          {
            text: "Сэкономить жертвенный скот и уплыть быстрее",
            effect: "Гнев +15%",
            action: function() { modifyState(0.1, 0, 15, -10); goTo('sirens'); }
          }
        ]
      },

      sirens: {
        title: "9. Сирены и пролив",
        text: "Впереди узкий пролив Сциллы и Харибды. У вас в руках финикийская карта или знания пророка.",
       choices: [
          {
            text: "Идти прямо сквозь Сциллу и Харибду (залив уши воском)",
            effect: "-6 воинов, Сохранить 3 года пути",
            action: function() { modifyState(0.2, -6, 0, -10); goTo('helios'); }
          },
          {
            text: "Обогнуть опасный пролив по дальнему круговому маршруту",
            effect: "+3 года пути, Воины целы",
            action: function() { modifyState(3, 0, -10, 0); goTo('helios'); }
          }
        ]
      },

      helios: {
        title: "10. Быки Гелиоса",
        text: "Ваши люди умирают от голода на острове Солнца. На лугу пасутся священные быки.",
        choices: [
          {
            text: "Жестко запретить трогать быков, питаться моллюсками и кореньями",
            effect: "Сохранить флот и людей!",
            action: function() { modifyState(0.5, 0, -30, -20); goTo('phaeacians'); }
          },
          {
            text: "Заколоть быков (Зевс уничтожит корабль молнией)",
            effect: "Гибель спутников, плен у Калипсо",
            action: function() { 
              modifyState(1, -(state.crew - 1), 20, -50); 
              goTo('calypso'); 
            }
          }
        ]
      },

      calypso: {
        title: "11. Плен у нимфы Калипсо",
        text: "Вы выброшены на остров Огигия. Прекрасная нимфа Калипсо предлагает вам любовь, вечную молодость и бессмертие, если вы останетесь с ней.",
        choices: [
          {
            text: "Остаться с Калипсо и стать бессмертным богом",
            effect: "ФИНАЛ: Бессмертие",
            action: function() { goTo('ending_calypso'); }
          },
          {
            text: "Скучать по Итаке, построить плот и уйти в море",
            effect: "+7 лет скитаний",
            action: function() { modifyState(7, 0, -10, 10); goTo('phaeacians'); }
          }
        ]
      },

      phaeacians: {
        title: "12. Страна Феаков",
        text: "Доброжелательный царь Алкиной предлагает снарядить магический быстроходный корабль, который доставит вас на Итаку за одну ночь.",
        choices: [
          {
            text: "Взойти на волшебный корабль феаков",
            effect: "Мгновенное прибытие на Итаку!",
            action: function() { modifyState(0.1, 0, -10, 50); goTo('ithaca_battle'); }
          }
        ]
      },

      ithaca_battle: {
        title: "13. Возвращение на Итаку",
        text: "Вы в родном дворце под видом нищего. 108 женихов требуют руки Пенелопы. В ваших руках снова оказывается ваш легендарный лук.",
        choices: [
          {
            text: "Запереть все двери и перебить всех женихов без пощады!",
            effect: "ФИНАЛ: Кровавая победа",
            action: function() { goTo('ending_bloody_victory'); }
          },
          {
            text: "Помиловать раскаявшихся, принять выкуп и избежать войны с их семьями",
            effect: "ФИНАЛ: Дипломатический мир",
            action: function() { goTo('ending_peaceful_king'); }
          }
        ]
      },

      // === ВСЕ 7 ВАРИАНТОВ КОНЦОВОК ===
      ending_legendary: {
        isEnding: true,
        title: "КОНЦОВКА: Легендарный Навигатор",
        text: "Благодаря финикийской карте течений и грамотному маневрированию в штормах вы вернулись на Итаку за рекордный 1 год!\n\nВсе 600 воинов вернулись живыми к своим семьям. Вы разгромили женихов свежими силами закаленной троянской армии, став величайшим мореплавателем Эллады!"
      },
      ending_pig: {
        isEnding: true,
        title: "КОНЦОВКА: Свиной Владыка Итаки",
        text: "Вы поддались искушению и осушили кубок Цирцеи. Волшебный напиток превратил вас в упитанного хряка с царственной щетиной.\n\nЦирцея почесала вас за ухом и выделила отдельный золотой загон. Вы забыли про Итаку, Пенелопу и войну. Жизнь удалась, хоть и на четырех копытах."
      },
      ending_storm_death: {
        isEnding: true,
        title: "КОНЦОВКА: Погибший у порога",
